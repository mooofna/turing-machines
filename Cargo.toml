[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mooofna/turing-machines"
authors = ["Maurice Heide"]
publish = false

[workspace.dependencies]
turing-core = { path = "crates/turing-core" }
turing-bb = { path = "crates/turing-bb" }
turing-render = { path = "crates/turing-render" }

thiserror = { version = "2.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0"
rustc-hash = { version = "2.1", default-features = false }
num-bigint = "0.5"
num-traits = "0.2"
num-integer = "0.1"
clap = { version = "4.6", features = ["derive"] }
annotate-snippets = "0.12"
anstream = "1.0"
png = "0.18"
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
miniz_oxide = "0.9"
base64 = "0.23"
console_error_panic_hook = "0.1.7"
proptest = "1.12"
insta = "1.49"
divan = "0.1.21"
trycmd = "1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
dbg_macro = "deny"
todo = "warn"
print_stdout = "warn"
allow_attributes_without_reason = "warn"
# `assert!(x.is_empty())` reads better than the suggested `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

# The WebAssembly module is optimised for size, except where speed matters: the simulators'
# hot loops are generic and instantiated in turing-wasm, and the deciders live in turing-bb.
# Measured in Node on an M1 Pro against opt-level 3 everywhere: 560 KB instead of 635 KB (240 KB
# instead of 264 KB gzipped); sessions and enumeration keep their speed, while parsing, layout
# and space-time rendering take 15 % to 50 % longer (still well under a millisecond per edit).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true

[profile.wasm-release.package.turing-wasm]
opt-level = 3

[profile.wasm-release.package.turing-bb]
opt-level = 3

[profile.bench]
debug = true

[profile.test]
opt-level = 1
