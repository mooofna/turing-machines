name: Machine for the gallery
description: Propose a Turing machine for the gallery
labels: [gallery]
body:
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: textarea
    id: machine
    attributes:
      label: Machine
      description: The machine in the description language or the standard format.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs in the gallery
      description: What it shows, and a source (paper, wiki page, course) if it is known.
    validations:
      required: true
